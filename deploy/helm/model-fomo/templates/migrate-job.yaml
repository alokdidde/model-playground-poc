# Runs `prisma migrate deploy` before new pods start, like App Platform's PRE_DEPLOY job.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fomo.name" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "fomo.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {{- include "fomo.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.worker }}:{{ .Values.image.tag }}"
          command: ["pnpm", "--filter", "@fomo/db", "migrate:deploy"]
          {{- include "fomo.env" . | nindent 10 }}
