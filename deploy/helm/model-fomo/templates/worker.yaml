apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fomo.name" . }}-worker
  labels: {{- include "fomo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels: {{- include "fomo.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # DBOS resumes interrupted workflows on another worker, so a short grace period is safe.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: "{{ .Values.image.worker }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "fomo.env" . | nindent 10 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
