# Local infrastructure. The apps run on the host with `pnpm dev`.
#   docker compose up -d                      # Postgres (app data, leases)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fomo
      POSTGRES_PASSWORD: fomo
      POSTGRES_DB: fomo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomo"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
