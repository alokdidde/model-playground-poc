# Local infrastructure. The apps run on the host with `pnpm dev`.
#   docker compose up -d                      # Postgres only (default lease store)
#   docker compose --profile redis up -d      # + Valkey, for LEASE_STORE=redis
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fomo
      POSTGRES_PASSWORD: fomo
      POSTGRES_DB: fomo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomo"]
      interval: 2s
      retries: 20

  # Same engine as DigitalOcean Managed Caching (Valkey, Redis-compatible).
  valkey:
    image: valkey/valkey:8
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
