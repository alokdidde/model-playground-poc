name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fomo
          POSTGRES_PASSWORD: fomo
          POSTGRES_DB: fomo
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fomo" --health-interval 2s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://fomo:fomo@localhost:5432/fomo
      # Runs the lease-store contract tests against real Postgres and Valkey too.
      TEST_DATABASE_URL: postgresql://fomo:fomo@localhost:5432/fomo
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @fomo/web build
